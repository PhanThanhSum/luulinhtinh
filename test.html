<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tổng chữ số nhỏ nhất: mô phỏng thuật toán</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
    <style>
        :root {
            --paper: #f2f5f7;
            --card: #fff;
            --ink: #1b2a41;
            --mute: #5d6b7e;
            --line: #d5dde5;
            --blue: #2f5bea;
            --blue-bg: #e4ebfd;
            --mint: #157a5a;
            --mint-bg: #d9f2e8;
            --amber: #f2b705;
            --amber-bg: #fff3c9
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0
        }

        body {
            font-family: "Be Vietnam Pro", system-ui, sans-serif;
            color: var(--ink);
            background: var(--paper);
            background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 28px 28px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px
        }

        .wrap {
            width: 100%;
            max-width: 1060px
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 4px
        }

        .sub {
            font-size: 14px;
            color: var(--mute);
            margin: 0 0 16px
        }

        .sub b {
            font-weight: 500;
            color: var(--ink);
            font-family: "JetBrains Mono", monospace
        }

        .grid {
            display: grid;
            grid-template-columns: minmax(0, 400px) minmax(0, 1fr);
            gap: 16px
        }

        @media(max-width:820px) {
            .grid {
                grid-template-columns: 1fr
            }
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 16px
        }

        .code {
            font-family: "JetBrains Mono", monospace;
            font-size: 13px;
            line-height: 1.75;
            margin: 0;
            padding: 0;
            list-style: none
        }

        .code li {
            padding: 0 8px;
            border-left: 3px solid transparent;
            white-space: pre;
            overflow: hidden;
            transition: background .25s
        }

        .code li.cm {
            color: var(--mute);
            margin-top: 6px
        }

        .code li.on {
            background: var(--blue-bg);
            border-left-color: var(--blue)
        }

        .row {
            display: grid;
            grid-template-columns: 78px repeat(5, minmax(0, 1fr));
            gap: 8px;
            align-items: center;
            margin-bottom: 8px
        }

        .lb {
            font-size: 13px;
            color: var(--mute)
        }

        .c {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--card);
            text-align: center;
            padding: 10px 0;
            font-size: 18px;
            font-weight: 500;
            min-height: 46px;
            transition: transform .3s, background .3s, border-color .3s
        }

        .c.i {
            border: 0;
            background: none;
            min-height: 0;
            padding: 0;
            font-size: 12px;
            color: var(--mute);
            font-weight: 400
        }

        .c.e {
            color: var(--line)
        }

        .c.cur {
            border: 2px solid var(--blue);
            background: var(--blue-bg);
            transform: translateY(-4px)
        }

        .c.hit {
            border-color: var(--mint);
            background: var(--mint-bg);
            color: var(--mint)
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 14px
        }

        .box {
            background: var(--paper);
            border-radius: 8px;
            padding: 10px 14px;
            min-height: 74px
        }

        .box .v {
            font-size: 22px;
            font-weight: 700;
            font-family: "JetBrains Mono", monospace;
            margin-top: 2px;
            min-height: 30px
        }

        .box.flash {
            animation: fl .7s
        }

        @keyframes fl {
            0% {
                background: var(--amber-bg)
            }

            100% {
                background: var(--paper)
            }
        }

        .cap {
            margin-top: 16px;
            font-size: 18px;
            line-height: 1.55;
            min-height: 84px;
            display: flex;
            align-items: center
        }

        .ctl {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-top: 12px
        }

        button,
        select {
            font: inherit;
            font-size: 14px;
            color: var(--ink);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 7px 12px;
            cursor: pointer
        }

        button:hover {
            border-color: var(--blue)
        }

        button:focus-visible,
        select:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 2px
        }

        .bar {
            height: 6px;
            background: var(--line);
            border-radius: 3px;
            margin-top: 16px;
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            width: 0;
            background: var(--blue);
            transition: width .4s
        }

        .sp {
            flex: 1
        }

        label {
            font-size: 14px;
            color: var(--mute);
            display: flex;
            gap: 6px;
            align-items: center
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                transition: none !important;
                animation: none !important
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <h1>Tìm số có tổng chữ số nhỏ nhất</h1>
        <p class="sub">Test: <b>n = 5</b>, mảng <b>2 33 66 11 4</b></p>
        <div class="grid">
            <div class="card">
                <ul class="code" id="code" aria-label="Mã nguồn C++"></ul>
            </div>
            <div class="card" aria-live="off">
                <div class="row"><span></span><span id="idx" style="display:contents"></span></div>
                <div class="row"><span class="lb">ds[i]</span><span id="ds" style="display:contents"></span></div>
                <div class="row"><span class="lb">dstong[i]</span><span id="sm" style="display:contents"></span></div>
                <div class="stats">
                    <div class="box">
                        <div class="lb">Phép tính</div>
                        <div class="v" id="calc" style="font-size:16px">&nbsp;</div>
                    </div>
                    <div class="box" id="minb">
                        <div class="lb">min</div>
                        <div class="v" id="min">-</div>
                    </div>
                    <div class="box">
                        <div class="lb">Kết quả in ra</div>
                        <div class="v" id="out" style="font-size:18px">-</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="cap card" id="cap" role="status"></div>
        <div class="bar"><i id="pg"></i></div>
        <div class="ctl">
            <button id="pp">Tạm dừng</button>
            <button id="pv">Bước trước</button>
            <button id="nx">Bước sau</button>
            <button id="rs">Chạy lại</button>
            <span class="sp"></span>
            <label>Tốc độ
                <select id="spd">
                    <option value="1.5">0.75x</option>
                    <option value="1" selected>1x</option>
                    <option value="0.65">1.5x</option>
                    <option value="0.45">2x</option>
                </select>
            </label>
            <label><input type="checkbox" id="vo"> Đọc thuyết minh</label>
        </div>
    </div>
    <script>
        const CODE = [
            ["cm", "// 1. nhapmang()"],
            ["", "cin >> n;  for(i = 0; i < n; i++) cin >> ds[i];"],
            ["cm", "// 2. tinhtongtatca()"],
            ["", "for(i = 0; i < n; i++)"],
            ["", "    dstong[i] = tcs(ds[i]);"],
            ["cm", "// 3. timtongmin()"],
            ["", "min = dstong[0];"],
            ["", "for(i = 1; i < n; i++)"],
            ["", "    if(dstong[i] < min) min = dstong[i];"],
            ["cm", "// 4. tim_va_in_ketqua(min)"],
            ["", "for(i = 0; i < n; i++)"],
            ["", "    if(dstong[i] == tongmin)"],
            ["", "        cout << ds[i] << \" \" << i + 1;"]
        ];
        document.getElementById("code").innerHTML = CODE.map((l, i) => `<li class="${l[0]}" id="L${i}">${l[1].replace(/</g, "&lt;")}</li>`).join("");

        const ds = [2, 33, 66, 11, 4], n = 5;
        const tcs = a => { let t = 0; while (a > 0) { t += a % 10; a = Math.floor(a / 10) } return t };
        const S = []; let sum = Array(n).fill(null), mn = null, out = [], show = false, hits = [];
        const add = o => S.push(Object.assign({ line: -1, cur: -1, calc: "", flash: false, show, sum: sum.slice(), mn, out: out.slice(), hit: hits.slice(), cap: "" }, o));
        add({ cap: "Bài toán: cho n số nguyên. Hãy tìm những số có tổng các chữ số nhỏ nhất, và in ra số đó cùng vị trí của nó." });
        show = true; add({ line: 1, cap: "Bước 1, nhapmang(): đọc n = 5, rồi đọc 5 số vào mảng ds." });
        add({ line: 3, cap: "Bước 2, tinhtongtatca(): với mỗi ds[i], tính tổng chữ số rồi lưu vào mảng dstong cùng vị trí." });
        for (let i = 0; i < n; i++) {
            sum[i] = tcs(ds[i]);
            add({ line: 4, cur: i, calc: `${String(ds[i]).split("").join(" + ")} = ${sum[i]}`, cap: `i = ${i}: tcs(${ds[i]}) = ${String(ds[i]).split("").join(" + ")} = ${sum[i]}, nên dstong[${i}] = ${sum[i]}.` });
        }
        add({ cap: "Xong bước 2. Mảng dstong là {2, 6, 12, 2, 4}.", line: 4 });
        mn = sum[0];
        add({ line: 6, cur: 0, flash: true, cap: "Bước 3, timtongmin(): đặt min bằng phần tử đầu tiên, dstong[0] = 2." });
        for (let i = 1; i < n; i++) {
            if (sum[i] < mn) { mn = sum[i]; add({ line: 8, cur: i, flash: true, cap: `i = ${i}: dstong[${i}] = ${sum[i]} bé hơn min, nên cập nhật min = ${mn}.` }) }
            else add({ line: 8, cur: i, cap: `i = ${i}: dstong[${i}] = ${sum[i]}, không bé hơn min (${mn}), giữ nguyên min.` });
        }
        add({ line: 8, cap: `Hết vòng lặp: hàm trả về tongmin = ${mn}.` });
        add({ line: 10, cap: "Bước 4, tim_va_in_ketqua(): duyệt lại dstong từ đầu, in mọi vị trí có tổng bằng tongmin." });
        for (let i = 0; i < n; i++) {
            if (sum[i] === mn) { hits.push(i); out.push(`${ds[i]} ${i + 1}`); add({ line: 12, cur: i, flash: true, cap: `i = ${i}: dstong[${i}] = ${sum[i]} bằng ${mn}, nên in ra "${ds[i]} ${i + 1}" (số và vị trí i + 1).` }) }
            else add({ line: 11, cur: i, cap: `i = ${i}: dstong[${i}] = ${sum[i]} khác ${mn}, bỏ qua.` });
        }
        add({ cap: "Kết quả: hai dòng 2 1 và 11 4. Vị trí tính từ 1 nên là i + 1." });

        const $ = id => document.getElementById(id);
        let k = 0, playing = true, timer = null, tDone = true, sDone = true;
        const vi = () => window.speechSynthesis && $("vo").checked;
        function render() {
            const s = S[k];
            CODE.forEach((_, i) => $("L" + i).classList.toggle("on", i === s.line));
            $("idx").innerHTML = ds.map((_, i) => `<div class="c i">${i}</div>`).join("");
            $("ds").innerHTML = ds.map((v, i) => `<div class="c${s.cur === i ? " cur" : ""}${s.hit.includes(i) ? " hit" : ""}${s.show ? "" : " e"}">${s.show ? v : "?"}</div>`).join("");
            $("sm").innerHTML = s.sum.map((v, i) => `<div class="c${s.cur === i ? " cur" : ""}${s.hit.includes(i) ? " hit" : ""}${v === null ? " e" : ""}">${v === null ? "?" : v}</div>`).join("");
            $("calc").innerHTML = s.calc || "&nbsp;";
            $("min").textContent = s.mn === null ? "-" : s.mn;
            $("out").innerHTML = s.out.length ? s.out.join("<br>") : "-";
            $("cap").textContent = s.cap;
            $("pg").style.width = (k / (S.length - 1) * 100) + "%";
            const b = $("minb"); b.classList.remove("flash"); if (s.flash) { void b.offsetWidth; b.classList.add("flash") }
        }
        function go(i) {
            clearTimeout(timer); if (window.speechSynthesis) speechSynthesis.cancel();
            k = Math.max(0, Math.min(S.length - 1, i)); render();
            tDone = false; sDone = true;
            if (vi()) { sDone = false; const u = new SpeechSynthesisUtterance(S[k].cap); u.lang = "vi-VN"; u.onend = u.onerror = () => { sDone = true; next() }; speechSynthesis.speak(u) }
            const ms = (2200 + S[k].cap.length * 55) * parseFloat($("spd").value);
            if (playing) timer = setTimeout(() => { tDone = true; next() }, ms);
        }
        function next() {
            if (!playing || !tDone || !sDone) return;
            if (k < S.length - 1) go(k + 1); else { playing = false; $("pp").textContent = "Xem lại" }
        }
        $("pp").onclick = () => {
            if (!playing && k === S.length - 1) { playing = true; $("pp").textContent = "Tạm dừng"; go(0); return }
            playing = !playing; $("pp").textContent = playing ? "Tạm dừng" : "Tiếp tục";
            if (playing) go(k); else { clearTimeout(timer); if (window.speechSynthesis) speechSynthesis.cancel() }
        };
        $("nx").onclick = () => go(k + 1); $("pv").onclick = () => go(k - 1);
        $("rs").onclick = () => { playing = true; $("pp").textContent = "Tạm dừng"; go(0) };
        $("vo").onchange = () => go(k);
        document.addEventListener("keydown", e => { if (e.code === "Space" && e.target.tagName !== "SELECT" && e.target.tagName !== "INPUT") { e.preventDefault(); $("pp").click() } else if (e.code === "ArrowRight") go(k + 1); else if (e.code === "ArrowLeft") go(k - 1) });
        if (!window.speechSynthesis) $("vo").parentNode.style.display = "none";
        go(0);
    </script>
</body>

</html>
